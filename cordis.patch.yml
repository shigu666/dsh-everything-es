# Everything search: a Host row with the es tool and its settings namespace.
- insert:
    - id: everything-search
      name: 'dsh-everything-es'
      config:
        # Empty means auto-detect: Program Files locations, then `es` on PATH,
        # then the architecture-matched es.exe bundled with this plugin.
        esPath: ''
        maxResults: 50
        timeoutMs: 15000
